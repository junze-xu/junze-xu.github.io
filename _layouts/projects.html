---
layout: default
---

<header class="page-hero">
  <p class="page-hero__kicker">PORTFOLIO · 公开项目</p>
  <h1>{{ page.title }}</h1>
  <p class="page-hero__sub">{{ page.subtitle | default: page.description }}</p>
  <div class="page-hero__meta">
    <strong>{{ site.data.portfolio.projects.size }}</strong>
    <span>个公开项目</span>
    <span class="divider">·</span>
    <span>全部托管于 GitHub Pages</span>
  </div>
</header>

<section class="section projects-section">
  <div class="container">
    {{ content }}
  </div>
</section>
