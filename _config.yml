# ---------------- #
#   Main Configs   #
# ---------------- #
baseurl: ""
url: https://junze-xu.github.io
date_format: "ordinal"
title: "JunzeXu's Blog"
subtitle: "徐钧泽"
description: "Junze Xu 的个人博客——深入 AI 的开发、研究与分析，聚焦 AI Infra 与 LLM 应用，沉淀可复现的技术笔记与工程实践。"
keywords: "AI Infra, LLM, AI 应用开发, AI 研究, 大模型, AI 数据分析, 系统编程, 技术博客"
og_image: /assets/images/og-cover.png
timezone: Asia/Shenzhen
encoding: "utf-8"
side_bar_repo_limit: 5

# ---------------- #
#      Author      #
# ---------------- #
author: Junze Xu
organization: 
organization_url: 
github_username: junze-xu
location: ShenZhen, China
email: b179455659@gmail.com

# ---------------- #
#    Navigation    #
# ---------------- #
navs:
  -
    href: /
    label: 首页

  -
    href: /archives/
    label: 归档

  -
    href: /projects/
    label: 项目

  -
    href: /wiki/
    label: 维基

  -
    href: /links/
    label: 友邻

  -
    href: /search/
    label: 搜索

  -
    href: /about/
    label: 关于

# ---------------- #
#       RSS        #
# ---------------- #
subscribe_rss: /feed.xml

# ---------------- #
#      Jekyll      #
# ---------------- #
markdown: kramdown
kramdown:
    input: GFM
highlighter: rouge
# paginate: 10 # 已停用：首页为全量分类导航，无需分页
lsi: false
quiet: false
excerpt_separator: "\n\n"
permalink: /:year/:month/:day/:title/
plugins:
    - jekyll-github-metadata
    - rouge
#     - jekyll-html-pipeline
#     - jekyll-paginate
    - jekyll-sitemap
    - jekyll-feed
    - jemoji
#     - jekyll-mentions
collections:
    wiki:
        output: true
        permalink: /wiki/:path/

repository: junze-xu/junze-xu.github.io

# ---------------- #
#      Comments    #
# ---------------- #
comments_provider: utterances

# Gitalk 已停止维护且需维护 clientSecret，已迁移至 utterances（无需 OAuth Secret）
utterances:
  repo: junze-xu/junze-xu.github.io
  issue_term: pathname # pathname | url | title | og:title | 自定义
  theme: github-dark # github-light | github-dark | 其他 utterances 主题
  label: comment

# 在使用其它评论组件时可点击显示 Disqus
#lazy_load_disqus : false

# ---------------- #
#      Search      #
# ---------------- #
simple_jekyll_search:
    # 是否支持全文搜索
    fulltext: true
    # 最多显示多少条搜索结果
    limit: 10

# ---------------- #
#    Analytics     #
# ---------------- #
google:
    analytics_id: 
